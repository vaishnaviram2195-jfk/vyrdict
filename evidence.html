<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Why This Score · VYRDICT</title>
<meta name="description" content="See the evidence, component scores and sources behind a VYRDICT product score.">
<style>
:root{--ink:#171511;--muted:#6d675f;--paper:#fffdf8;--bg:#f4ede5;--line:#d8cec4;--soft:#f8f3ed;--good:#eaf2e8;--blush:#efe4dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{width:min(1080px,calc(100% - 34px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line)}.top .shell{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:27px;font-weight:950;letter-spacing:-.06em}.back{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px;color:var(--ink);text-decoration:none;font-size:10px;font-weight:900}.hero{padding:58px 0 28px}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.hero h1{font:400 clamp(42px,6vw,68px)/.98 Georgia,serif;letter-spacing:-.05em;margin:0 0 10px}.hero p{color:var(--muted);font-size:14px;line-height:1.6;max-width:760px}.scorebar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:22px 0}.score{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px}.score small{font-size:8px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}.score b{font:400 42px/1 Georgia,serif;display:block;margin:8px 0}.score span{font-size:10px;color:var(--muted)}.high{background:var(--good)}.section{padding:34px 0;border-top:1px solid var(--line)}.section h2{font:400 34px/1 Georgia,serif;letter-spacing:-.035em;margin:0 0 10px}.section>p,.section .intro{color:var(--muted);font-size:13px;line-height:1.6}.formula{background:var(--ink);color:white;border-radius:20px;padding:18px;font-size:12px;line-height:1.6;margin:16px 0}.formula b{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#f3ccd6;margin-bottom:4px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.input{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px}.input .row{display:flex;justify-content:space-between;gap:10px;align-items:center}.input strong{font-size:11px}.input em{font:400 27px/1 Georgia,serif;font-style:normal}.input small{display:block;color:var(--muted);font-size:9px;line-height:1.4;margin-top:8px}.input p{color:#554e48;font-size:10px;line-height:1.5;margin:8px 0 0}.method{display:inline-flex!important;width:auto!important;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 7px;margin-right:4px;font-size:7px!important;font-weight:950;text-transform:uppercase;letter-spacing:.07em}.sources{display:grid;gap:10px;margin-top:18px}.source{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px}.sourcehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.source b{font-size:12px}.pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 7px;font-size:7px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.source p{font-size:11px;color:var(--muted);line-height:1.55;margin:9px 0}.source a{color:var(--ink);font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.07em}.notice{border:1px solid var(--line);background:var(--blush);border-radius:18px;padding:16px;font-size:11px;line-height:1.55;margin:18px 0}.bands{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.band{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px}.band b{font-size:10px;display:block}.band span{font-size:9px;color:var(--muted);line-height:1.35;display:block;margin-top:4px}.loading{padding:80px 0;text-align:center;color:var(--muted)}.err{background:#f6e9e4;border:1px solid #e3cbc2;border-radius:18px;padding:20px;margin:40px 0;font-size:12px}@media(max-width:760px){.scorebar,.inputs,.bands{grid-template-columns:1fr}.top .shell{align-items:flex-start}.hero{padding-top:42px}}
</style>
</head><body>
<header class="top"><div class="shell"><div class="brand">VYRDICT.</div><a class="back" href="./">← Back to VYRDICT</a></div></header>
<main class="shell"><div id="app" class="loading">Loading the evidence…</div></main>
<script>
(()=>{const API='https://shmbvkjzeqqxybweyowj.supabase.co/functions/v1/vyrdict-evidence';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('slug')||'';const groups={viral:['social','search','creator'],consumer:['review_sentiment','rating','repurchase'],value:['price_value','category_value'],risk:['sponsorship','controversy'],momentum:['momentum']};function inputs(data,keys){return keys.map(k=>{const x=data.inputs?.[k];if(!x)return'';return `<div class="input"><div class="row"><strong>${esc(x.label)}</strong><em>${esc(x.score)}</em></div><small><span class="method">${esc(x.measurement_label||'Evidence rubric')}</span>${x.weight?`${esc(x.weight)}% of ${esc(x.weight_context||'component')}`:''}</small><p>${esc(x.rationale)}</p></div>`}).join('')}function sources(data){return (data.evidence||[]).map(x=>`<div class="source"><div class="sourcehead"><b>${esc(x.source_publisher||x.source_label||'Source')}</b><span class="pill">${esc((x.evidence_bucket||'evidence').replace('_',' '))}</span></div><p>${esc(x.claim_summary||'Evidence reviewed by VYRDICT.')}</p><a href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">Open source ↗</a></div>`).join('')}function bands(data){return (data.normalization?.bands||[]).map(x=>`<div class="band"><b>${esc(x.range)}</b><span>${esc(x.label)}</span></div>`).join('')}const wait=ms=>new Promise(r=>setTimeout(r,ms));async function loadEvidence(){let last;for(let attempt=0;attempt<3;attempt++){try{const r=await fetch(API+'?slug='+encodeURIComponent(slug),{cache:'no-store'});let d={};try{d=await r.json()}catch{}if(r.ok)return{r,d};if(r.status===404)return{r,d};last=new Error(d.error||'Evidence unavailable')}catch(e){last=e}if(attempt<2)await wait(attempt===0?450:1100)}throw last||new Error('Evidence unavailable')}async function run(){if(!slug){$('#app').className='err';$('#app').textContent='No product was specified.';return}try{const {r,d}=await loadEvidence();if(!r.ok){$('#app').className='err';$('#app').textContent=r.status===404?'This product does not yet have a public V2 evidence file.':'We could not load this evidence right now. Please refresh and try again.';return}const p=d.product;document.title=`Why ${p.name} scored ${p.viral_score}/${p.worth_score} · VYRDICT`;$('#app').className='';$('#app').innerHTML=`<section class="hero"><div class="eyebrow">Why this score · ${esc(p.methodology_version||'VYRDICT')}</div><h1>${esc(p.brand)} ${esc(p.name)}</h1><p>This page shows how VYRDICT reached the score. Component scores are normalized 0–100 evidence signals—not percentages of all consumers or all social posts.</p><div class="scorebar"><div class="score"><small>Viral Score</small><b>${esc(p.viral_score)}/100</b><span>Attention index</span></div><div class="score"><small>Worth Score</small><b>${esc(p.worth_score)}/100</b><span>Evidence of real-world value</span></div><div class="score high"><small>Evidence confidence</small><b style="font-size:30px;text-transform:capitalize">${esc(p.evidence_confidence||'—')}</b><span>${esc(d.readiness?.url_sources||0)} linked sources · ${esc(d.readiness?.source_domains||0)} source domains</span></div></div></section><section class="section"><h2>How component numbers are measured.</h2><p class="intro"><strong>Direct metric</strong> means a directly observed number. <strong>Normalized metric</strong> converts a real metric such as a rating onto the VYRDICT scale. <strong>Evidence rubric</strong> is a structured assessment of documented evidence. <strong>Evidence proxy</strong> is used when the ideal raw dataset is unavailable and the substitute is disclosed.</p><div class="bands">${bands(d)}</div></section><section class="section"><h2>Viral Score breakdown.</h2><div class="formula"><b>Formula</b>${esc(d.formula.viral)}</div><div class="inputs">${inputs(d,groups.viral)}</div></section><section class="section"><h2>Worth Score breakdown.</h2><div class="formula"><b>Formula</b>${esc(d.formula.worth)}</div><div class="inputs">${inputs(d,groups.consumer)}${inputs(d,groups.value)}${inputs(d,groups.momentum)}${inputs(d,groups.risk)}</div><div class="notice">Hype-risk inputs are a penalty. A promotional-saturation score does not allege undisclosed sponsorship; it reflects how heavily the product’s visibility depends on promotional, creator or celebrity exposure.</div></section><section class="section"><h2>Evidence reviewed.</h2><p class="intro">These links are the audit trail behind the score inputs above. Sources can support different parts of the score, and brand-owned claims are not treated as equivalent to independent testing or verified-buyer evidence.</p><div class="sources">${sources(d)}</div></section><section class="section"><p class="intro">Last verified: ${p.last_verified_at?new Date(p.last_verified_at).toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'}):'—'}. Read the full <a href="./how-vyrdict-scores.html">VYRDICT scoring methodology</a>.</p></section>`}catch(e){$('#app').className='err';$('#app').textContent='We could not load this evidence right now. Please refresh and try again.'}}run()})();
</script></body></html>
