    .head-nav{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.head-nav::-webkit-scrollbar{display:none}.head-nav a{white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 11px;font:800 8px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;background:#fbfaf7}.head-nav a.active{background:#171717;color:#fff}.home-link{text-decoration:none;font:700 10px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #222;padding-bottom:5px}

    @media(max-width:980px){.wrap{width:min(100% - 42px,900px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:46px}}
    @media(max-width:620px){.site-head{height:auto;min-height:58px;padding:10px 14px;display:grid;grid-template-columns:1fr;gap:9px}.brand{font-size:21px}.head-nav{width:100%}.head-nav a{font-size:7px;padding:8px 9px}.home-link{display:none}.wrap{width:calc(100% - 24px)}.hero{padding:30px 0 21px}.kicker{font-size:8px;margin-bottom:9px}h1{font-size:34px;line-height:1}.intro{display:block;margin-top:13px}.intro p{font-size:12.5px;line-height:1.48;max-width:34em}.stamp{text-align:left;margin-top:9px;font-size:7px}.products{padding:18px 0 44px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 10px}.media,.sk-media{aspect-ratio:.92}.media img{width:84%;height:84%;filter:drop-shadow(0 8px 13px rgba(0,0,0,.07))}.rank{top:7px;left:7px;padding:5px 6px;font-size:7px}.copy{padding:9px 0 0}.meta{font-size:6.8px;line-height:1.2;letter-spacing:.08em;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name{font-size:12.5px;line-height:1.25;min-height:32px}.scores{font-size:7.2px;line-height:1.25;gap:6px 8px;flex-wrap:wrap;margin-top:7px;letter-spacing:.035em}.status{font-size:7px;line-height:1.2;margin-top:6px;letter-spacing:.065em}.sk-line{margin-top:8px}.loading,.empty{padding:26px 0;font-size:8px}}

<body>
  <header class="site-head"><a class="brand" href="/" aria-label="VYRDICT home">VYRDICT</a><nav class="head-nav" aria-label="Culture collections"><a class="active" href="/collection/viral-right-now/">Viral Right Now</a><a href="/collection/celebrity-effect/">Celebrity Effect</a><a href="/collection/seen-on-screen/">Seen on Screen</a></nav><a class="home-link" href="/">Back home</a></header>
  <main>
    <section class="hero"><div class="wrap"><div class="kicker">LIVE VYRDICT SIGNALS</div><h1>Viral right now.</h1><div class="intro"><p>The products with the strongest live momentum right now — refreshed from current VYRDICT signals instead of a static collection from weeks ago.</p><div class="stamp" id="stamp">Live signals</div></div></div></section>
    <section class="products"><div class="wrap"><div class="grid" id="grid"><div class="skeleton"><div class="sk-media"></div><div class="sk-line short"></div><div class="sk-line name"></div><div class="sk-line score"></div></div><div class="skeleton"><div class="sk-media"></div><div class="sk-line short"></div><div class="sk-line name"></div><div class="sk-line score"></div></div><div class="skeleton"><div class="sk-media"></div><div class="sk-line short"></div><div class="sk-line name"></div><div class="sk-line score"></div></div><div class="skeleton"><div class="sk-media"></div><div class="sk-line short"></div><div class="sk-line name"></div><div class="sk-line score"></div></div></div></div></section>
  </main>
  <script>
    (()=>{
      const CACHE_KEY='vyrdict:viral-now:v1';
      const CACHE_TTL=10*60*1000;
      const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const cleanStatus=s=>String(s||'').replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());
      const grid=document.getElementById('grid'),stamp=document.getElementById('stamp');
      let hasRendered=false;

      function render(j,fromCache=false){
        const ps=(j?.products||[]).filter(p=>p&&p.slug&&p.image_url);
        if(!ps.length)return false;
        grid.innerHTML=ps.map((p,i)=>`<a class="card" href="/product/${encodeURIComponent(p.slug)}/"><div class="media"><img loading="${i<4?'eager':'lazy'}" decoding="async" fetchpriority="${i<4?'high':'auto'}" src="${esc(p.image_url)}" alt="${esc((p.brand||'')+' '+(p.name||''))}"><span class="rank">${String(i+1).padStart(2,'0')}</span></div><div class="copy"><div class="meta">${esc(p.category||'Viral')} · ${esc(p.brand||'')}</div><h2 class="name">${esc(p.name||'')}</h2><div class="scores"><span>Viral <b>${Math.round(Number(p.viral_score||0))}</b></span><span>Worth <b>${Math.round(Number(p.worth_score||0))}</b></span></div><div class="status">${esc(cleanStatus(p.viral_status||'Trending'))}</div></div></a>`).join('');
        const d=j.generated_at?new Date(j.generated_at):new Date();
        stamp.textContent=`Fresh ${j.window_days||10}-day signal window · ${fromCache?'Updated':'Updated'} ${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
        hasRendered=true;
        return true;
      }

      function readCache(){
        try{
          const c=JSON.parse(sessionStorage.getItem(CACHE_KEY)||'null');
          if(c?.data?.products?.length&&Date.now()-Number(c.at||0)<CACHE_TTL)return c.data;
        }catch{}
        return null;
      }
      function saveCache(data){try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),data}))}catch{}}

      async function refresh(){
        try{
          const r=await fetch('/api/viral-now?limit=24',{headers:{accept:'application/json'}});
          if(!r.ok)throw new Error('feed');
          const j=await r.json();
          if(!(j.products||[]).some(p=>p&&p.slug&&p.image_url))throw new Error('empty');
          saveCache(j);
          render(j,false);
        }catch{
          if(!hasRendered){
            grid.innerHTML='<div class="empty">The live viral feed is refreshing. Please try again in a moment.</div>';
            stamp.textContent='Live feed';
          }
        }
      }

      const cached=readCache();
      if(cached)render(cached,true);
      refresh();
    })();
  </script>
  <script src="/mobile-categories-hardfix.js?v=1-20260930-guaranteed" defer></script>
</body>
