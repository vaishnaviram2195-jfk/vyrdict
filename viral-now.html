<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Viral Right Now — VYRDICT</title>
  <meta name="description" content="The products with the strongest live momentum on VYRDICT right now, ranked from fresh signals.">
  <link rel="canonical" href="https://vyrdict.com/collection/viral-right-now/">
  <link rel="icon" href="/vyrdict-logo.svg" type="image/svg+xml">
  <style>
    :root{--ink:#171717;--muted:#68645f;--paper:#f6f4ef;--card:#fbfaf7;--line:rgba(0,0,0,.12);--serif:"Iowan Old Style",Baskerville,"Times New Roman",Georgia,serif;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit}
    .site-head{position:sticky;top:0;z-index:1000;height:66px;padding:0 max(20px,calc((100vw - 1320px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(246,244,239,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .brand{display:inline-flex;align-items:flex-end;text-decoration:none;font:900 25px/1 Arial,sans-serif;letter-spacing:-1.5px}.brand:after{content:"";width:6px;height:6px;background:#d94d73;margin:0 0 2px 2px}
    .home-link{text-decoration:none;font:700 10px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #222;padding-bottom:5px}
    .wrap{width:min(1320px,calc(100% - 80px));margin:0 auto}
    .hero{padding:54px 0 30px;border-bottom:1px solid var(--line)}
    .kicker{font:800 10px/1 Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#5f5b56;margin-bottom:12px}
    h1{font:400 clamp(38px,4.4vw,58px)/.98 var(--serif);letter-spacing:-.045em;margin:0;max-width:780px}
    .intro{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-top:18px}.intro p{font:400 15px/1.6 var(--sans);color:var(--muted);max-width:650px;margin:0}.stamp{font:700 9px/1.4 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#77716a;text-align:right}
    .products{padding:28px 0 64px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 18px}
    .card{display:flex;flex-direction:column;text-decoration:none;min-width:0}.media{aspect-ratio:.88;background:#e9e7e1;display:grid;place-items:center;overflow:hidden;position:relative}.media img{width:88%;height:88%;object-fit:contain;display:block;filter:drop-shadow(0 12px 20px rgba(0,0,0,.08));transition:transform .35s ease}.card:hover .media img{transform:scale(1.02)}
    .rank{position:absolute;top:12px;left:12px;background:rgba(246,244,239,.9);padding:7px 8px;font:800 8px/1 Arial,sans-serif;letter-spacing:.12em}
    .copy{padding:14px 1px 0}.meta{font:800 9px/1.25 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#74706a;margin-bottom:7px}.name{font:500 16px/1.3 Arial,sans-serif;margin:0;min-height:42px}.scores{display:flex;gap:14px;margin-top:11px;font:700 9px/1 Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#666}.scores b{color:#171717}.status{margin-top:9px;font:700 9px/1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#69645e}
    .loading,.empty{grid-column:1/-1;padding:60px 0;text-align:center;color:#6d675f;font:700 11px/1.5 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:980px){.wrap{width:min(100% - 42px,900px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:46px}}
    @media(max-width:620px){.site-head{height:60px;padding:0 15px}.brand{font-size:22px}.wrap{width:calc(100% - 30px)}.hero{padding:36px 0 24px}h1{font-size:38px;line-height:1}.intro{display:block;margin-top:15px}.stamp{text-align:left;margin-top:12px}.products{padding:24px 0 54px}.grid{grid-template-columns:1fr;gap:30px}.media{aspect-ratio:1.02}.name{min-height:0}}
  </style>
</head>
<body>
  <header class="site-head"><a class="brand" href="/" aria-label="VYRDICT home">VYRDICT</a><a class="home-link" href="/">Back home</a></header>
  <main>
    <section class="hero"><div class="wrap"><div class="kicker">LIVE VYRDICT SIGNALS</div><h1>Viral right now.</h1><div class="intro"><p>The products with the strongest live momentum right now — refreshed from current VYRDICT signals instead of a static collection from weeks ago.</p><div class="stamp" id="stamp">Refreshing…</div></div></div></section>
    <section class="products"><div class="wrap"><div class="grid" id="grid"><div class="loading">Loading the freshest viral products…</div></div></div></section>
  </main>
  <script>
    (()=>{
      const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const cleanStatus=s=>String(s||'').replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());
      async function load(){
        const grid=document.getElementById('grid'),stamp=document.getElementById('stamp');
        try{
          const r=await fetch('/api/viral-now?limit=24',{headers:{accept:'application/json'},cache:'no-store'});
          if(!r.ok)throw new Error('feed');
          const j=await r.json();
          const ps=(j.products||[]).filter(p=>p&&p.slug&&p.image_url);
          if(!ps.length)throw new Error('empty');
          grid.innerHTML=ps.map((p,i)=>`<a class="card" href="/product/${encodeURIComponent(p.slug)}/"><div class="media"><img loading="${i<4?'eager':'lazy'}" src="${esc(p.image_url)}" alt="${esc((p.brand||'')+' '+(p.name||''))}"><span class="rank">${String(i+1).padStart(2,'0')}</span></div><div class="copy"><div class="meta">${esc(p.category||'Viral')} · ${esc(p.brand||'')}</div><h2 class="name">${esc(p.name||'')}</h2><div class="scores"><span>Viral <b>${Math.round(Number(p.viral_score||0))}</b></span><span>Worth <b>${Math.round(Number(p.worth_score||0))}</b></span></div><div class="status">${esc(cleanStatus(p.viral_status||'Trending'))}</div></div></a>`).join('');
          const d=j.generated_at?new Date(j.generated_at):new Date();
          stamp.textContent=`Fresh ${j.window_days||10}-day signal window · Updated ${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
        }catch{
          grid.innerHTML='<div class="empty">The live viral feed is refreshing. Please try again in a moment.</div>';
          stamp.textContent='Live feed';
        }
      }
      load();
    })();
  </script>
  <script src="/mobile-categories-hardfix.js?v=1-20260930-guaranteed" defer></script>
</body>
</html>
