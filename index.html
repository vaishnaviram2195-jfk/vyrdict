 chip=old;if(!chip){chip=document.createElement('div');chip.className='vyrdict-verified'}chip.textContent='✓ Verified '+label;chip.title='Product information last verified '+label;const h=block.querySelector('h2,h3');if(h)h.insertAdjacentElement('afterend',chip);else block.prepend(chip)}function schedule(){setTimeout(place,40);setTimeout(place,280)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule,{once:true});else schedule();addEventListener('hashchange',schedule);addEventListener('popstate',schedule);document.addEventListener('click',()=>schedule(),{passive:true})})();<\/script>`;if(html.includes('</head>'))html=html.replace('</head>',css+'</head>');if(html.includes('</body>'))html=html.replace('</body>',trust+freshness+'</body>');document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="loading"><div><b>VYRDICT.</b><p>Could not load the site. Please refresh.</p></div></div>';console.error(e)}})();</script></body></html>
