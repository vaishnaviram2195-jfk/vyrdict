<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4ede5">
<title>VYRDICT Command Center</title>
<style>
:root{--bg:#f4ede5;--paper:#fffdf8;--ink:#171511;--muted:#746c64;--line:#d9cec5;--pink:#e65f72;--soft:#eee4dc;--good:#345f4b;--shadow:0 18px 55px rgba(58,43,32,.08)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{width:min(1180px,calc(100% - 34px));margin:0 auto;padding:26px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:flex-end;font-weight:950;font-size:26px;letter-spacing:-1.6px}.brand:after{content:'';width:7px;height:7px;background:var(--pink);display:inline-block;margin:0 0 3px 2px}.eyebrow{margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-decoration:none}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.hero{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--shadow);margin-bottom:18px}.heroRow{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.hero h1{font:500 clamp(34px,5vw,58px)/.98 Georgia,serif;letter-spacing:-.035em;margin:0;max-width:760px}.hero p{margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.55;max-width:760px}.live{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(52,95,75,.1)}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--soft);border-radius:999px;padding:8px 10px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}.metric .label{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.metric .value{font:500 34px/1 Georgia,serif;margin-top:9px}.metric .delta{font-size:10px;font-weight:800;margin-top:8px;color:var(--muted)}.delta.up{color:var(--good)}.delta.down{color:#995346}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-bottom:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:21px;min-width:0}.panel h2{font:500 25px/1.05 Georgia,serif;letter-spacing:-.02em;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}.bars{display:flex;align-items:end;gap:8px;height:190px;margin-top:20px;padding-top:8px;border-bottom:1px solid var(--line)}.barcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;align-items:stretch}.barpair{display:flex;align-items:end;justify-content:center;gap:3px;height:150px}.bar{width:min(18px,43%);border-radius:6px 6px 2px 2px;background:#2c2925;min-height:2px}.bar.secondary{background:#b9aea6}.barlabel{font-size:9px;color:var(--muted);text-align:center;white-space:nowrap}.legend{display:flex;gap:14px;align-items:center;margin-top:12px;color:var(--muted);font-size:10px}.legend i{width:8px;height:8px;border-radius:2px;background:#2c2925;display:inline-block;margin-right:5px}.legend i.alt{background:#b9aea6}.list{margin-top:16px;display:grid;gap:10px}.row{display:grid;grid-template-columns:minmax(100px,1fr) 2.2fr auto;gap:10px;align-items:center}.row .name{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}.fill{height:100%;background:#2c2925;border-radius:999px}.num{font-size:11px;font-weight:800;min-width:28px;text-align:right}.products{margin-top:14px;display:grid;gap:9px}.product{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border-top:1px solid #eee5df;padding-top:9px}.product:first-child{border-top:0;padding-top:0}.rank{width:28px;height:28px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:10px;font-weight:900}.product b{display:block;font-size:12px}.product span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.opens{font:500 21px/1 Georgia,serif}.funnel{display:grid;gap:11px;margin-top:17px}.funnelrow{display:grid;grid-template-columns:110px 1fr 50px;gap:10px;align-items:center}.funnelrow label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.funnelbar{height:18px;background:var(--soft);border-radius:7px;overflow:hidden}.funnelbar div{height:100%;background:#2c2925;border-radius:7px;min-width:3px}.funnelrow strong{text-align:right;font-size:11px}.callout{background:#181614;color:#fff;border-radius:22px;padding:19px;margin-top:18px}.callout b{font:500 21px/1.1 Georgia,serif}.callout p{font-size:11px;color:#c9c1bb;line-height:1.5;margin:8px 0 0}.footer{color:var(--muted);font-size:10px;line-height:1.5;margin-top:18px;text-align:center}.locked{min-height:100vh;display:grid;place-items:center;padding:24px}.lockcard{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow);text-align:center}.lockcard h1{font:500 36px/1 Georgia,serif;margin:16px 0 8px}.lockcard p{color:var(--muted);line-height:1.5;font-size:13px}.spinner{width:24px;height:24px;border:3px solid #ddd0c7;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin:16px auto}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:980px){.metrics{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.heroRow{flex-direction:column}.live{align-self:flex-start}}
@media(max-width:620px){.shell{width:min(100% - 22px,1180px);padding-top:16px}.top{align-items:flex-start}.actions{justify-content:flex-end}.btn{padding:9px 11px}.hero{padding:20px;border-radius:23px}.hero h1{font-size:39px}.metrics{grid-template-columns:1fr 1fr;gap:9px}.metric{padding:15px;border-radius:19px}.metric .value{font-size:30px}.grid3{grid-template-columns:1fr;gap:12px}.panel{padding:18px;border-radius:21px}.bars{gap:4px}.barlabel{font-size:8px}.row{grid-template-columns:88px 1fr 28px}.funnelrow{grid-template-columns:86px 1fr 42px}.product{grid-template-columns:28px 1fr auto}}
</style>
</head>
<body>
<div id="app" class="locked"><div class="lockcard"><div class="brand" style="justify-content:center">VYRDICT</div><h1>Command Center</h1><p>Loading your private analytics dashboard.</p><div class="spinner"></div></div></div>
<script>
(()=>{
const ENDPOINT='https://shmbvkjzeqqxybweyowj.supabase.co/functions/v1/vyrdict-analytics-dashboard';
const KEY_STORE='vyrdict:command-center:key';
const q=new URLSearchParams(location.search),incoming=q.get('key');
if(incoming){try{sessionStorage.setItem(KEY_STORE,incoming)}catch{}history.replaceState(null,'','/command-center/')}
let key='';try{key=sessionStorage.getItem(KEY_STORE)||''}catch{}
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const n=v=>Number(v||0).toLocaleString();
const pct=(a,b)=>{a=Number(a||0);b=Number(b||0);if(!b)return a?100:0;return Math.round((a-b)/b*100)};
const delta=(a,b)=>{const d=pct(a,b),cls=d>0?'up':d<0?'down':'';return `<div class="delta ${cls}">${d>0?'▲ ':d<0?'▼ ':''}${Math.abs(d)}% vs previous 24h</div>`};
const metric=(label,value,d='')=>`<div class="metric"><div class="label">${esc(label)}</div><div class="value">${n(value)}</div>${d}</div>`;
const list=(items)=>{const max=Math.max(1,...items.map(x=>Number(x.value||0)));return `<div class="list">${items.map(x=>`<div class="row"><div class="name" title="${esc(x.label)}">${esc(x.label)}</div><div class="track"><div class="fill" style="width:${Math.max(2,Number(x.value||0)/max*100)}%"></div></div><div class="num">${n(x.value)}</div></div>`).join('')}</div>`};
const productList=(items)=>`<div class="products">${items.map((x,i)=>`<div class="product"><div class="rank">${i+1}</div><div><b>${esc(x.name)}</b><span>${esc(x.brand||'')} ${x.brand?'· ':''}${esc(x.slug)}</span></div><div class="opens">${n(x.opens)}</div></div>`).join('')}</div>`;
function bars(items){const max=Math.max(1,...items.flatMap(x=>[Number(x.page_views||0),Number(x.product_opens||0)]));return `<div class="bars">${items.map(x=>{const d=new Date(x.date+'T12:00:00');return `<div class="barcol"><div class="barpair"><div class="bar" style="height:${Math.max(2,Number(x.page_views||0)/max*100)}%" title="${n(x.page_views)} page views"></div><div class="bar secondary" style="height:${Math.max(2,Number(x.product_opens||0)/max*100)}%" title="${n(x.product_opens)} product opens"></div></div><div class="barlabel">${d.toLocaleDateString(undefined,{weekday:'short'})}</div></div>`}).join('')}</div><div class="legend"><span><i></i>Page views</span><span><i class="alt"></i>Product opens</span></div>`}
function funnel(d){const base=Math.max(1,Number(d.page_views||0));const rows=[['Page views',d.page_views],['Product opens',d.product_opens],['Sign-ins',d.signins],['Retailer clicks',d.retailer_clicks],['Saves',d.saves]];return `<div class="funnel">${rows.map(([l,v])=>`<div class="funnelrow"><label>${esc(l)}</label><div class="funnelbar"><div style="width:${Math.max(1,Number(v||0)/base*100)}%"></div></div><strong>${n(v)}</strong></div>`).join('')}</div>`}
function insight(d){const t=d.today||{},src=d.sources_today||[],countries=d.countries_today||[],tops=d.top_products_24h||[];const us=(countries.find(x=>x.label==='US')||{}).value||0;const ca=(countries.find(x=>x.label==='CA')||{}).value||0;const top=tops[0];const totalCountry=countries.reduce((a,x)=>a+Number(x.value||0),0);const usShare=totalCountry?Math.round(us/totalCountry*100):0;let bits=[];if(usShare>=50)bits.push(`${usShare}% of today’s tracked page views are from the U.S.`);if(top)bits.push(`${top.name} is the most-opened product in the last 24 hours (${top.opens} opens).`);if(Number(t.returning_page_views||0)>0){const share=Math.round(Number(t.returning_page_views||0)/Math.max(1,Number(t.page_views||0))*100);bits.push(`${share}% of today’s page views are classified as returning.`)}return bits.join(' ')}
function render(d){const t=d.today||{},l=d.last24h||{},p=d.prev24h||{},gen=new Date(d.generated_at);app.className='';app.innerHTML=`<main class="shell">
<div class="top"><div><div class="brand">VYRDICT</div><div class="eyebrow">Internal Command Center</div></div><div class="actions"><a class="btn" href="/" target="_blank" rel="noreferrer">Open site</a><button class="btn primary" id="refresh">Refresh</button></div></div>
<section class="hero"><div class="heroRow"><div><h1>What are people doing on VYRDICT?</h1><p>Live product and traffic signals with automated QA traffic removed. Page views are page loads/events, not guaranteed unique visitors.</p></div><div class="live"><span class="dot"></span> Live analytics</div></div><div class="meta"><span class="pill">Updated ${esc(gen.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))}</span><span class="pill">Toronto time</span><span class="pill">${n(d.qa_page_views_removed)} QA page views excluded</span></div></section>
<section class="metrics">${metric('Page views · today',t.page_views,delta(l.page_views,p.page_views))}${metric('Product opens · today',t.product_opens,delta(l.product_opens,p.product_opens))}${metric('Sign-ins · today',t.signins,delta(l.signins,p.signins))}${metric('Retailer clicks · today',t.retailer_clicks,delta(l.retailer_clicks,p.retailer_clicks))}${metric('Saves · today',t.saves,delta(l.saves,p.saves))}${metric('Searches · today',t.searches,delta(l.searches,p.searches))}</section>
<section class="grid2"><div class="panel"><h2>7-day momentum</h2><div class="sub">Page views and product opens by Toronto calendar day.</div>${bars(d.daily_7d||[])}</div><div class="panel"><h2>Action funnel</h2><div class="sub">Last 24 hours. This is directional behavior, not a unique-user conversion funnel.</div>${funnel(l)}<div class="callout"><b>Signal</b><p>${esc(insight(d)||'Keep collecting traffic. The dashboard will surface a clearer signal as volume grows.')}</p></div></div></section>
<section class="grid3"><div class="panel"><h2>Where traffic comes from</h2><div class="sub">Today’s acquisition source on page-view events.</div>${list(d.sources_today||[])}</div><div class="panel"><h2>Where people are</h2><div class="sub">Country resolved on page-view events.</div>${list(d.countries_today||[])}</div><div class="panel"><h2>New vs returning</h2><div class="sub">Today’s page-view classification on this browser.</div>${list([{label:'New',value:t.new_page_views||0},{label:'Returning',value:t.returning_page_views||0}])}</div></section>
<section class="grid2"><div class="panel"><h2>Most-opened products</h2><div class="sub">Top product detail opens in the last 24 hours.</div>${productList(d.top_products_24h||[])}</div><div class="panel"><h2>Category interest</h2><div class="sub">Category-open events in the last 24 hours.</div>${(d.top_categories_24h||[]).length?list(d.top_categories_24h):'<div class="sub" style="margin-top:18px">Not enough category-open events yet.</div>'}<div class="callout"><b>${n(d.totals?.page_views)} clean page views tracked</b><p>Tracking began ${d.tracking_started?esc(new Date(d.tracking_started).toLocaleDateString()):'recently'}. Raw total before QA filtering: ${n(d.raw_page_views)}.</p></div></div></section>
<div class="footer">Private VYRDICT analytics · No customer-level personal data is shown here · Auto-refreshes every 60 seconds</div></main>`;document.getElementById('refresh').onclick=load}
function locked(msg){app.className='locked';app.innerHTML=`<div class="lockcard"><div class="brand" style="justify-content:center">VYRDICT</div><h1>Private dashboard</h1><p>${esc(msg)}</p><p style="font-size:11px">Open the private command-center link to access analytics.</p></div>`}
async function load(){if(!key){locked('This page needs your private access key.');return}const btn=document.getElementById('refresh');if(btn){btn.disabled=true;btn.textContent='Refreshing…'}try{const r=await fetch(ENDPOINT+'?key='+encodeURIComponent(key),{cache:'no-store',referrerPolicy:'no-referrer'});if(!r.ok){if(r.status===404){try{sessionStorage.removeItem(KEY_STORE)}catch{}key='';locked('The access key is missing or invalid.');return}throw Error('HTTP '+r.status)}render(await r.json())}catch(e){locked('Analytics are temporarily unavailable. Refresh in a moment.')}}
load();setInterval(()=>{if(key&&document.visibilityState==='visible')load()},60000);
})();
</script>
</body>
</html>
