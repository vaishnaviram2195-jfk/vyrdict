name: VYRDICT Product Score + Back Regression

on:
  push:
    paths:
      - 'navigation-guard.js'
      - 'api/score-discovery.js'
      - 'score-discovery-guard.js'
      - 'vercel.json'
      - '.github/workflows/vyrdict-product-score-back-regression.yml'
  workflow_dispatch:

jobs:
  product-score-back:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for current production routes
        run: |
          for i in $(seq 1 40); do
            NAV=$(curl -fsSL 'https://vyrdict.com/navigation-guard.js?v=1' || true)
            SCORE=$(curl -fsSI 'https://vyrdict.com/score-discovery?slug=seeq-clear-protein&market=US' || true)
            if echo "$NAV" | grep -q '__vyrdictNavigationGuardV7' && echo "$SCORE" | grep -qi 'content-type: text/html'; then
              echo 'Current navigation and score discovery route are live'
              exit 0
            fi
            sleep 5
          done
          echo 'Current production routes did not reach production in time'
          exit 1
      - name: Verify scores, back routing, and score discovery HTML
        run: |
          cat > product-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e?.stack||e?.message||e)));

            await page.goto('https://vyrdict.com/product/lattafa-eclaire/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.productHero').waitFor({state:'visible',timeout:30000});
            await page.waitForFunction(()=>{
              const vals=[...document.querySelectorAll('.productHero .ring b')].slice(0,2).map(x=>(x.textContent||'').trim());
              return vals.length===2&&vals.every(v=>/^\d{1,3}$/.test(v));
            },null,{timeout:15000});
            const scores=await page.locator('.productHero .ring b').evaluateAll(xs=>xs.slice(0,2).map(x=>(x.textContent||'').trim()));
            console.log('ECLAIRE_SCORES',JSON.stringify(scores));
            assert(scores[0]==='99',`Expected Viral 99, got ${scores[0]}`);
            assert(scores[1]==='86',`Expected Worth 86, got ${scores[1]}`);

            const back=page.locator('[data-back]').first();
            await back.waitFor({state:'visible',timeout:10000});
            await back.click();
            await page.waitForURL(u=>u.origin==='https://vyrdict.com'&&u.pathname==='/',{timeout:20000});
            await page.locator('[data-product]').first().waitFor({state:'visible',timeout:30000});
            console.log('PRODUCT_BACK_HOME_PASS',page.url());

            const scoreResponse=await page.goto('https://vyrdict.com/score-discovery?slug=seeq-clear-protein&market=US&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            const ct=scoreResponse?.headers()['content-type']||'';
            console.log('SCORE_DISCOVERY_CONTENT_TYPE',ct);
            assert(/text\/html/i.test(ct),'Score Discovery is not being served as HTML: '+ct);
            await page.locator('#app').waitFor({state:'visible',timeout:30000});
            await page.waitForFunction(()=>/Score Discovery/i.test(document.body.innerText||'')&&/SEE?Q|Clear Protein/i.test(document.body.innerText||''),null,{timeout:30000});
            const raw=(await page.locator('body').innerText()).trim();
            assert(!/^<!?doctype|^<html/i.test(raw),'Score Discovery is rendering raw HTML text');
            console.log('SCORE_DISCOVERY_HTML_PASS',page.url());

            await page.goto('https://vyrdict.com/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            const lip=page.locator('[data-product="kylie-cosmetics-original-lip-kit"]').first();
            await lip.waitFor({state:'visible',timeout:30000});
            const target=await lip.getAttribute('data-product');
            console.log('LIP_KIT_CARD_TARGET',target);
            await lip.click();
            await page.waitForURL(/\/product\//,{timeout:20000});
            await page.locator('.productHero').waitFor({state:'visible',timeout:30000});
            const landed=new URL(page.url()).pathname;
            const heading=(await page.locator('.productHero h1').first().textContent()||'').trim();
            console.log('LIP_KIT_LANDED_URL',page.url());
            console.log('LIP_KIT_HEADING',heading);
            assert(landed==='/product/kylie-cosmetics-original-lip-kit/',`Lip Kit routed to wrong URL: ${landed}`);
            assert(/Original Lip Kit/i.test(heading),`Wrong product rendered after Lip Kit click: ${heading}`);
            assert(!/Eclaire/i.test(heading),`Lip Kit incorrectly rendered Eclaire: ${heading}`);

            assert(!errors.some(e=>/SyntaxError|Invalid regular expression/i.test(e)),'Fatal JS error: '+errors.join(' | '));
            console.log('PRODUCT_SCORE_BACK_DISCOVERY_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node product-qa.js
