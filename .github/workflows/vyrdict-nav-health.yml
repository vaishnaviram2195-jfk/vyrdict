name: VYRDICT Navigation Health

on:
  push:
    paths:
      - '.github/workflows/vyrdict-nav-health.yml'
      - 'top-nav-section-fix.js'
      - 'navigation-context.js'
      - 'navigation-guard.js'
      - 'api/home.js'
      - 'api/home-stable.js'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyrdict-nav-health
  cancel-in-progress: true

jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify all live homepage navigation
        shell: bash
        run: |
          cat > nav-check.js <<'JS'
          const { chromium } = require('playwright');
          const HOME='https://vyrdict.com/';
          const REV='20260928-nav-7';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors=[];
            page.on('pageerror',e=>{pageErrors.push(e.message);console.log('PAGEERROR:',e.message)});

            async function loadHome(){
              let rev='';
              for(let i=0;i<12;i++){
                await page.goto(HOME+'?nav-health='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1200);
                rev=await page.evaluate(()=>document.documentElement.getAttribute('data-vyrdict-home-rev')||window.__VYRDICT_HOME_REV||'');
                if(rev===REV)break;
                console.log('WAITING_FOR_REVISION',rev||'(none)');
                await page.waitForTimeout(2500);
              }
              assert(rev===REV,`Expected live homepage revision ${REV}, got ${rev||'(none)'}`);
              await page.waitForTimeout(1000);
              await page.waitForSelector('header a',{timeout:10000});
            }

            async function headerLink(kind){
              const loc=page.locator(`header [data-vyrdict-topnav-kind="${kind}"]`).first();
              assert(await loc.count()===1,`Missing wired ${kind} header link`);
              return loc;
            }

            for(const [kind,target] of [['explore','#trending-index'],['categories','#categories'],['culture','#culture']]){
              await loadHome();
              const link=await headerLink(kind);
              console.log('CLICK',kind,'href',await link.getAttribute('href'));
              await link.click({timeout:8000});
              await page.waitForFunction(sel=>{
                const el=document.querySelector(sel);if(!el)return false;
                const r=el.getBoundingClientRect();
                return window.scrollY>150&&r.top>-40&&r.top<220;
              },target,{timeout:8000});
              const result=await page.evaluate(sel=>{const r=document.querySelector(sel).getBoundingClientRect();return {url:location.href,scrollY:Math.round(scrollY),top:Math.round(r.top)}},target);
              console.log('PASS',kind,JSON.stringify(result));
            }

            await loadHome();
            const account=await headerLink('account');
            console.log('CLICK account href',await account.getAttribute('href'));
            await account.click({timeout:8000});
            await page.waitForURL(/\/account\.html(?:[?#]|$)/,{timeout:10000});
            await page.waitForSelector('#authCard',{timeout:10000});
            const accountText=await page.locator('body').innerText();
            assert(accountText.includes('Keep your saves everywhere.'),'Account page did not render');
            console.log('PASS account',page.url(),await page.title());

            await loadHome();
            const saves=await headerLink('saves');
            console.log('CLICK saves href',await saves.getAttribute('href'));
            await saves.click({timeout:8000});
            await page.waitForURL(/\/saved\/?(?:[?#]|$)/,{timeout:10000});
            await page.waitForTimeout(1800);
            const savedText=await page.locator('body').innerText();
            assert(/saved/i.test(savedText),'Saved-products page did not render');
            console.log('PASS saves',page.url(),savedText.slice(0,220).replace(/\n/g,' | '));

            console.log('NAVIGATION_PASS: Explore, Categories, Culture, Account and Saves all passed on public vyrdict.com');
            if(pageErrors.length)console.log('NON_NAV_PAGE_ERRORS',JSON.stringify([...new Set(pageErrors)]));
            await browser.close();
          })().catch(e=>{console.error('NAVIGATION_FAIL:',e);process.exit(1)});
          JS
          node nav-check.js
