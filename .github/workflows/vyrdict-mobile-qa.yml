name: VYRDICT Production QA

on:
  push:
    paths:
      - '.github/workflows/vyrdict-mobile-qa.yml'
      - 'index.html'
      - 'analytics.js'
      - 'product-shell.js'
      - 'product-fast.js'
      - 'product-detail-consistency.js'
      - 'product-card-alignment.js'
      - 'homepage-simplify.js'
      - 'social-links-fix.js'
  workflow_dispatch:

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Test live VYRDICT interactions and timings
        shell: bash
        run: |
          set -o pipefail
          mkdir -p qa
          echo '{"ok":false,"status":"runner-started"}' > qa/report.json
          cat > qa/vyrdict-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base='https://vyrdict.com';
          const report={ok:true,runs:[]};
          const save=()=>fs.writeFileSync('qa/report.json',JSON.stringify(report,null,2));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const badRuntime=s=>/ReferenceError|TypeError|SyntaxError|Invalid regular expression flags/i.test(s);
          async function waitReady(page,selector,timeout=20000){await page.locator(selector).first().waitFor({state:'visible',timeout})}
          async function runViewport(browser,name,viewport,isMobile){
            const context=await browser.newContext({viewport,deviceScaleFactor:1,isMobile,hasTouch:isMobile});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+(e.stack||e.message)));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            const out={name,timings:{}};
            let t=Date.now();
            const response=await page.goto(base+'/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await waitReady(page,'.hero');await waitReady(page,'#categories .categories');
            out.timings.homeReadyMs=Date.now()-t;
            assert(response&&response.status()<400,`${name}: home HTTP ${response?.status()}`);
            const home=await page.evaluate(()=>({text:document.body?.innerText||'',scrollWidth:document.documentElement.scrollWidth,innerWidth:innerWidth,expanders:[...document.querySelectorAll('#categories button,#categories summary')].filter(x=>/more categories|fewer categories/i.test(x.textContent||'')).map(x=>({tag:x.tagName,text:x.textContent.trim(),cls:x.className})),detailsCount:document.querySelectorAll('#categories details.v-home-category-details').length,categories:[...document.querySelectorAll('#categories [data-category]')].map(x=>x.dataset.category)}));
            out.home=home;report.current=out;save();
            assert(!/Could not load the site/i.test(home.text),`${name}: loader error visible`);
            assert(home.scrollWidth<=home.innerWidth+4,`${name}: horizontal overflow ${home.scrollWidth}>${home.innerWidth}`);
            assert(home.detailsCount===1,`${name}: expected exactly one category details control, saw ${home.detailsCount}`);
            assert(home.expanders.length===1,`${name}: expected exactly one category expander, saw ${home.expanders.length}: ${JSON.stringify(home.expanders)}`);
            assert(home.categories.length>6,`${name}: expected more than six categories`);
            const summary=page.locator('#categories details.v-home-category-details > summary');
            await summary.click();await page.waitForTimeout(160);
            const expanded=await page.evaluate(()=>{const d=document.querySelector('#categories details.v-home-category-details'),extra=d?.querySelector('.v-home-category-extra');return {open:d?.open,text:d?.querySelector('summary')?.textContent||'',visible:[...document.querySelectorAll('#categories [data-category]')].filter(x=>x.offsetParent!==null&&getComputedStyle(x).display!=='none'&&getComputedStyle(x).visibility!=='hidden').length,extraDisplay:extra?getComputedStyle(extra).display:null,extraVisibility:extra?getComputedStyle(extra).visibility:null,extraButtons:extra?[...extra.querySelectorAll('[data-category]')].map(x=>({name:x.dataset.category,hidden:x.hidden,display:getComputedStyle(x).display,visibility:getComputedStyle(x).visibility})):[]}});
            out.expanded=expanded;save();
            assert(expanded.open===true,`${name}: category expander did not open: ${JSON.stringify(expanded)}`);assert(/show fewer categories/i.test(expanded.text),`${name}: category expander label did not change: ${JSON.stringify(expanded)}`);assert(expanded.visible>6,`${name}: expanded categories did not become visible: ${JSON.stringify(expanded)}`);
            await summary.click();await page.waitForTimeout(80);assert(await page.locator('#categories details.v-home-category-details').evaluate(d=>!d.open),`${name}: category expander did not close`);
            const firstCategory=page.locator('#categories .categories > [data-category]').first();out.category=await firstCategory.getAttribute('data-category');t=Date.now();await firstCategory.click();await page.waitForURL(/\/category\//,{timeout:10000});await waitReady(page,'.grid');out.timings.categoryNavigationMs=Date.now()-t;
            await page.goto(base+'/?qa2='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await waitReady(page,'.hero');
            const product=page.locator('[data-product]').first();await product.waitFor({state:'visible',timeout:15000});out.productSlug=await product.getAttribute('data-product');t=Date.now();await product.click();await page.waitForURL(/\/product\//,{timeout:10000});await waitReady(page,'.productHero',15000);out.timings.productClickMs=Date.now()-t;
            const productText=await page.locator('body').innerText();assert(/VIRAL SCORE/i.test(productText)&&/WORTH SCORE/i.test(productText),`${name}: product scores missing`);assert(/WHERE TO BUY/i.test(productText),`${name}: where-to-buy missing`);assert(!/Loading the VYRDICT…/i.test(productText),`${name}: product still shows loading state`);
            await page.waitForTimeout(250);out.errors=errors;save();assert(!errors.some(badRuntime),`${name}: runtime JS error ${errors.join(' | ')}`);
            await page.screenshot({path:`qa/${name}-product.png`,fullPage:true});delete report.current;report.runs.push(out);save();await context.close();
          }
          async function directProduct(browser){
            const context=await browser.newContext({viewport:{width:1280,height:900}});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.stack||e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            const url=base+'/product/d-alba-white-truffle-first-spray-serum-100ml/?qa='+Date.now();const t=Date.now();const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});await waitReady(page,'.productHero',20000);const ms=Date.now()-t;
            const text=await page.locator('body').innerText();assert(response&&response.status()<400,`direct product HTTP ${response?.status()}`);assert(/White Truffle/i.test(text),`direct product content missing`);assert(/WHERE TO BUY/i.test(text),`direct product where-to-buy missing`);assert(!errors.some(badRuntime),`direct product JS error: ${errors.join(' | ')}`);
            report.directProduct={readyMs:ms,url:page.url(),errors};save();await page.screenshot({path:'qa/direct-product.png',fullPage:true});await context.close();
          }
          (async()=>{let browser;try{browser=await chromium.launch({headless:true});await runViewport(browser,'mobile',{width:390,height:844},true);await runViewport(browser,'desktop',{width:1440,height:1000},false);await directProduct(browser);report.ok=true;save();console.log(JSON.stringify(report,null,2))}catch(e){report.ok=false;report.error=String(e);save();console.error(e);process.exitCode=1}finally{await browser?.close()}})();
          NODE
          node qa/vyrdict-qa.js 2>&1 | tee qa/console.log
      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyrdict-production-qa
          path: qa/
          retention-days: 7
