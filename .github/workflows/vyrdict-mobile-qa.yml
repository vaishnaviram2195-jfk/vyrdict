name: VYRDICT Mobile QA

on:
  push:
    paths:
      - '.github/workflows/vyrdict-mobile-qa.yml'
      - 'index.html'
      - 'header-brand-fix.js'
      - 'homepage-hero-variety.js'
      - 'homepage-simplify.js'
      - 'homepage-mobile-final.js'
  workflow_dispatch:

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Test VYRDICT at phone width
        run: |
          mkdir -p qa
          cat > /tmp/mobile-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://vyrdict.com';
          const tests = [];
          function assert(ok, msg){ if(!ok) throw new Error(msg); }
          async function check(page, name, url, required=[]){
            const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(7000);
            const info = await page.evaluate(() => ({
              title: document.title,
              text: document.body?.innerText || '',
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
              hero1Alt: document.querySelector('.stage .p1 img')?.alt || '',
              hero2Alt: document.querySelector('.stage .p2 img')?.alt || '',
              hero1Key: document.querySelector('.stage .p1 img')?.dataset?.vyrdictHeroVariety || '',
              hero2Key: document.querySelector('.stage .p2 img')?.dataset?.vyrdictHeroVariety || '',
              categoryButton: document.querySelector('.v-home-category-more')?.textContent?.trim() || '',
              visibleCategories: [...document.querySelectorAll('[data-category]')].filter(x=>!x.hidden).length
            }));
            assert(response && response.status() < 400, `${name}: HTTP ${response?.status()}`);
            assert(!/Could not load the site/i.test(info.text), `${name}: loader error visible`);
            assert(info.scrollWidth <= info.innerWidth + 4, `${name}: horizontal page overflow ${info.scrollWidth}px > ${info.innerWidth}px`);
            for(const phrase of required) assert(info.text.toLowerCase().includes(phrase.toLowerCase()), `${name}: missing “${phrase}”`);
            if(name==='home'){
              assert(info.hero1Key==='blendboss' || /BlendBOSS/i.test(info.hero1Alt), `home: Blender hero missing (${info.hero1Alt})`);
              assert(info.hero2Key==='baccarat-rouge-540' || /Baccarat Rouge/i.test(info.hero2Alt), `home: Baccarat Rouge hero missing (${info.hero2Alt})`);
              assert(/See more categories|Show fewer categories/i.test(info.categoryButton), `home: category expansion control missing`);
              assert(info.visibleCategories >= 6, `home: fewer than six categories visible`);
            }
            await page.screenshot({path:`qa/${name}.png`,fullPage:true});
            tests.push({name,url:page.url(),status:'pass',...info});
          }
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page = await context.newPage();
            try {
              await check(page,'home',`${base}/`,['VYRDICT','Viral Right Now','Worth the Hype']);
              await check(page,'dalba',`${base}/product/d-alba-white-truffle-first-spray-serum-100ml`,['White Truffle','Worth the Hype','What it does','Why it’s viral','Where to buy']);
              await check(page,'suggest',`${base}/suggest-product.html`,['What product is suddenly everywhere?','Product name','Send to VYRDICT']);
              await check(page,'scores',`${base}/how-vyrdict-scores.html`,['How VYRDICT scores the hype','Viral Score','Worth Score']);
              fs.writeFileSync('qa/report.json',JSON.stringify({ok:true,tests},null,2));
              console.log(JSON.stringify({ok:true,tests},null,2));
            } catch(e) {
              fs.writeFileSync('qa/report.json',JSON.stringify({ok:false,error:String(e),tests},null,2));
              console.error(e);
              process.exitCode=1;
            } finally { await browser.close(); }
          })();
          NODE
          node /tmp/mobile-qa.js
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyrdict-mobile-qa
          path: qa/
          retention-days: 7
