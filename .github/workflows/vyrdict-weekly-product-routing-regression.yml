name: VYRDICT Weekly Product Routing Regression

on:
  push:
    paths:
      - 'navigation-guard.js'
      - 'weekly-ranking-expand.js'
      - '.github/workflows/vyrdict-weekly-product-routing-regression.yml'
  workflow_dispatch:

jobs:
  weekly-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for navigation guard V6
        run: |
          for i in $(seq 1 40); do
            if curl -fsSL 'https://vyrdict.com/navigation-guard.js?v=1' | grep -q '__vyrdictNavigationGuardV6'; then
              echo 'Navigation guard V6 is live'
              exit 0
            fi
            sleep 5
          done
          echo 'Navigation guard V6 did not reach production in time'
          exit 1
      - name: Verify Original Lip Kit routes to Kylie
        run: |
          cat > weekly-routing-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e?.stack||e?.message||e)));
            await page.goto('https://vyrdict.com/?weeklyqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('[data-product]').first().waitFor({state:'visible',timeout:30000});

            const weeklyHeading=page.getByText(/weekly viral rankings/i).first();
            await weeklyHeading.waitFor({state:'visible',timeout:20000});
            const section=weeklyHeading.locator('xpath=ancestor::section[1]');

            const makeup=section.getByRole('button',{name:/^makeup$/i});
            if(await makeup.count()){
              await makeup.first().click();
              await page.waitForTimeout(500);
            }

            const more=section.getByRole('button',{name:/see more rankings|keep climbing the ranking/i});
            if(await more.count()){
              await more.first().click();
              await page.waitForTimeout(1200);
            }

            let card=section.locator('.vyrdict-weekly-extra-v8[data-slug="kylie-cosmetics-original-lip-kit"]');
            if(!(await card.count())){
              card=section.locator('article,.card,.vyrdict-weekly-extra-v8').filter({hasText:/Original Lip Kit/i}).first();
            }
            await card.waitFor({state:'visible',timeout:20000});
            const info=await card.evaluate(el=>({slug:el.getAttribute('data-slug'),text:(el.innerText||'').slice(0,300),buttonSlug:el.querySelector('[data-product]')?.getAttribute('data-product')||null}));
            console.log('ORIGINAL_LIP_KIT_CARD',JSON.stringify(info));
            assert(/Original Lip Kit/i.test(info.text),'Did not find Original Lip Kit card');

            const see=card.getByRole('button',{name:/see vyrdict/i}).first();
            await see.waitFor({state:'visible',timeout:10000});
            await see.click();
            await page.waitForURL(u=>u.pathname==='/product/kylie-cosmetics-original-lip-kit/',{timeout:20000});
            await page.locator('.productHero').waitFor({state:'visible',timeout:30000});
            const productText=await page.locator('.productHero').innerText();
            console.log('DESTINATION',page.url(),productText.slice(0,220));
            assert(/Original Lip Kit/i.test(productText),'Wrong product content after navigation');
            assert(!/Eclaire/i.test(productText),'Eclaire content appeared after Original Lip Kit click');
            assert(!errors.some(e=>/SyntaxError|Invalid regular expression/i.test(e)),'Fatal JS error: '+errors.join(' | '));
            console.log('ORIGINAL_LIP_KIT_ROUTING_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node weekly-routing-qa.js
