name: VYRDICT Weekly Product Routing Regression

on:
  push:
    paths:
      - 'navigation-guard.js'
      - 'weekly-ranking-expand.js'
      - '.github/workflows/vyrdict-weekly-product-routing-regression.yml'
  workflow_dispatch:

jobs:
  weekly-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for navigation guard V6
        run: |
          for i in $(seq 1 40); do
            if curl -fsSL 'https://vyrdict.com/navigation-guard.js?v=1' | grep -q '__vyrdictNavigationGuardV6'; then
              echo 'Navigation guard V6 is live'
              exit 0
            fi
            sleep 5
          done
          echo 'Navigation guard V6 did not reach production in time'
          exit 1
      - name: Verify Original Lip Kit routing integrity
        run: |
          cat > weekly-routing-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e?.stack||e?.message||e)));

            // Real search result: Original Lip Kit must route to Kylie.
            await page.goto('https://vyrdict.com/search?q=Original%20Lip%20Kit&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            const realCard=page.locator('article,.card').filter({hasText:/Original Lip Kit/i}).first();
            await realCard.waitFor({state:'visible',timeout:30000});
            const realBtn=realCard.locator('[data-product]').first();
            const realSlug=await realBtn.getAttribute('data-product');
            console.log('REAL_ORIGINAL_LIP_KIT_BUTTON',realSlug);
            assert(realSlug==='kylie-cosmetics-original-lip-kit',`Real card has wrong slug: ${realSlug}`);
            await realBtn.click();
            await page.waitForURL(u=>u.pathname==='/product/kylie-cosmetics-original-lip-kit/',{timeout:20000});
            await page.locator('.productHero').waitFor({state:'visible',timeout:30000});
            let text=await page.locator('.productHero').innerText();
            assert(/Original Lip Kit/i.test(text),'Real card opened wrong product content');
            assert(!/Eclaire/i.test(text),'Real card opened Eclaire');

            // Deterministic reproduction of the exact clone bug: the visible
            // cloned card says Kylie, but its copied button still says Eclaire.
            await page.goto('https://vyrdict.com/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('[data-product]').first().waitFor({state:'visible',timeout:30000});
            await page.evaluate(()=>{
              const card=document.createElement('article');
              card.className='vyrdict-weekly-extra-v8';
              card.dataset.slug='kylie-cosmetics-original-lip-kit';
              card.style.cssText='position:fixed;left:8px;top:120px;z-index:9999;background:white;padding:20px';
              card.innerHTML='<h3>Original Lip Kit</h3><button id="qa-stale-clone" data-product="lattafa-eclaire">SEE VYRDICT</button>';
              document.body.appendChild(card);
            });
            const stale=page.locator('#qa-stale-clone');
            await stale.click();
            await page.waitForURL(u=>u.pathname==='/product/kylie-cosmetics-original-lip-kit/',{timeout:20000});
            await page.locator('.productHero').waitFor({state:'visible',timeout:30000});
            text=await page.locator('.productHero').innerText();
            console.log('CLONE_DESTINATION',page.url(),text.slice(0,180));
            assert(/Original Lip Kit/i.test(text),'Stale clone guard opened wrong product');
            assert(!/Eclaire/i.test(text),'Stale clone guard still opened Eclaire');
            assert(!errors.some(e=>/SyntaxError|Invalid regular expression/i.test(e)),'Fatal JS error: '+errors.join(' | '));
            console.log('ORIGINAL_LIP_KIT_ROUTING_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node weekly-routing-qa.js
