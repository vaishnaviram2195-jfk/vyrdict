name: VYRDICT Mobile Hero QA

on:
  push:
    paths:
      - 'homepage-hero-variety.js'
      - 'homepage-mobile-final.js'
      - 'header-brand-fix.js'
      - 'growth-retention.js'
      - 'index.html'
      - 'mobile-home.html'
      - 'vercel.json'
      - '.github/workflows/mobile-hero-qa.yml'
  workflow_dispatch:

jobs:
  mobile-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify current hero on normal Android homepage
        run: |
          mkdir -p qa-mobile-hero
          cat > qa-mobile-hero/check.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:412,height:915},
              deviceScaleFactor:2.625,
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro Build/BP2A.250705.008) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://vyrdict.com/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.hero').waitFor({state:'visible',timeout:20000});
            await page.waitForTimeout(5000);
            const state=await page.evaluate(()=>{
              const hero=document.querySelector('.hero');
              const stage=document.querySelector('.stage');
              const layer=document.getElementById('vyrdict-hero-v8-layer');
              const cs=stage?getComputedStyle(stage):null;
              return {
                href:location.href,
                freshShell:window.__vyrdictMobileFreshShell===1,
                heroClass:hero?.className||'',
                heroVersion:hero?.dataset?.vyrdictHeroVersion||'',
                currentHero:!!hero?.classList.contains('vyrdict-hero-v8'),
                legacyStatic:!!hero?.classList.contains('vyrdict-current-static'),
                stageVisibility:cs?.visibility||null,
                stageOpacity:cs?.opacity||null,
                layerPresent:!!layer,
                layerChildren:layer?.children?.length||0,
                oldStyle:!!document.getElementById('vyrdict-mobile-final-style'),
                width:innerWidth
              };
            });
            state.errors=errors;
            fs.writeFileSync('qa-mobile-hero/state.json',JSON.stringify(state,null,2));
            await page.screenshot({path:'qa-mobile-hero/mobile-home.png',fullPage:false});
            console.log(state);
            if(!state.freshShell)throw new Error('Normal mobile root did not use fresh mobile shell: '+JSON.stringify(state));
            if(!state.currentHero)throw new Error('Current mobile hero class missing: '+JSON.stringify(state));
            if(state.legacyStatic)throw new Error('Legacy static mobile hero still active: '+JSON.stringify(state));
            if(state.stageVisibility!=='hidden')throw new Error('Legacy stage is visible: '+JSON.stringify(state));
            if(!state.layerPresent||state.layerChildren<1)throw new Error('Current hero product layer missing: '+JSON.stringify(state));
            if(state.oldStyle)throw new Error('Legacy mobile style still loaded: '+JSON.stringify(state));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa-mobile-hero/check.js
      - name: Upload mobile hero evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hero-qa
          path: qa-mobile-hero/
          retention-days: 7
