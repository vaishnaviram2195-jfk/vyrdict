name: VYRDICT Mobile Hero QA

on:
  push:
    paths:
      - 'homepage-hero-variety.js'
      - 'homepage-mobile-final.js'
      - 'header-brand-fix.js'
      - 'growth-retention.js'
      - 'index.html'
      - 'mobile-home.html'
      - 'vercel.json'
      - '.github/workflows/mobile-hero-qa.yml'
  workflow_dispatch:

jobs:
  mobile-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify real Android homepage motion
        run: |
          mkdir -p qa-mobile-hero
          cat > qa-mobile-hero/check.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:412,height:915},
              deviceScaleFactor:2.625,
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro Build/BP2A.250705.008) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.stack||String(e)));
            const response=await page.goto('https://vyrdict.com/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(3500);

            const snap=()=>page.evaluate(()=>{
              const hero=document.querySelector('.hero');
              const stage=document.querySelector('.stage');
              const layer=document.getElementById('vyrdict-hero-v8-layer');
              const cs=stage?getComputedStyle(stage):null;
              const items=[...(layer?.querySelectorAll('.vh8-product')||[])].map(el=>{
                const r=el.getBoundingClientRect(),img=el.querySelector('img'),style=getComputedStyle(el),anims=el.getAnimations();
                const visible=r.right>0&&r.left<innerWidth&&r.bottom>0&&r.top<innerHeight&&Number(style.opacity||1)>.05;
                return {
                  src:img?.currentSrc||img?.src||'',naturalWidth:img?.naturalWidth||0,
                  left:Math.round(r.left),top:Math.round(r.top),width:Math.round(r.width),height:Math.round(r.height),
                  opacity:style.opacity,visible,
                  running:anims.some(a=>a.playState==='running'),
                  animationTimes:anims.map(a=>Math.round(Number(a.currentTime)||0))
                };
              });
              return {
                href:location.href,
                homeRevision:document.documentElement.getAttribute('data-vyrdict-home-rev')||'',
                heroPresent:!!hero,
                heroClass:hero?.className||'',
                heroVersion:hero?.dataset?.vyrdictHeroVersion||'',
                motionRevision:window.__vyrdictHeroMotionRev||'',
                currentHero:!!hero?.classList.contains('vyrdict-hero-v8'),
                legacyStatic:!!hero?.classList.contains('vyrdict-current-static'),
                stageVisibility:cs?.visibility||null,
                stageOpacity:cs?.opacity||null,
                layerPresent:!!layer,
                layerChildren:items.length,
                loaded:items.filter(x=>x.naturalWidth>0).length,
                visible:items.filter(x=>x.visible&&x.naturalWidth>0).length,
                running:items.filter(x=>x.running).length,
                items,
                oldStyle:!!document.getElementById('vyrdict-mobile-final-style'),
                width:innerWidth
              };
            });

            const samples=[];
            for(let i=0;i<5;i++){
              samples.push(await snap());
              await page.screenshot({path:`qa-mobile-hero/root-${i}.png`,fullPage:false});
              await page.waitForTimeout(500);
            }
            const state=samples[samples.length-1];
            state.status=response?.status()||null;
            state.headers=response?await response.allHeaders():{};
            state.errors=errors;
            state.samples=samples.map(s=>({layerChildren:s.layerChildren,loaded:s.loaded,visible:s.visible,running:s.running,items:s.items}));
            fs.writeFileSync('qa-mobile-hero/root.json',JSON.stringify(state,null,2));
            console.log(JSON.stringify(state,null,2));

            if(state.status!==200)throw new Error('Homepage returned '+state.status);
            if(!samples.some(s=>s.currentHero))throw new Error('Current mobile hero missing');
            if(samples.some(s=>s.legacyStatic))throw new Error('Legacy static hero active');
            if(!samples.some(s=>s.layerPresent&&s.layerChildren>=3))throw new Error('Current product layer missing');
            if(!samples.some(s=>s.loaded>=3))throw new Error('Catalog product images did not load');
            if(!samples.some(s=>s.visible>=1))throw new Error('No catalog product picture became visible');
            if(!samples.some(s=>s.running>=1))throw new Error('Catalog product pictures are present but not moving');
            if(state.stageVisibility!=='hidden'||state.stageOpacity!=='0')throw new Error('Legacy stage still visible');
            if(state.oldStyle)throw new Error('Legacy mobile style loaded');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa-mobile-hero/check.js
      - name: Upload mobile hero evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hero-qa
          path: qa-mobile-hero/
          retention-days: 7
