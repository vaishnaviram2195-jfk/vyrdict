name: VYRDICT Final Site Audit V3

on:
  push:
    paths:
      - '.github/workflows/vyrdict-final-site-audit-v3.yml'
  workflow_dispatch:

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify repaired bundle
        run: |
          for i in $(seq 1 40); do
            NAV=$(curl -fsSL 'https://vyrdict.com/navigation-guard.js?v=1' || true)
            BUNDLE=$(curl -fsSL 'https://shmbvkjzeqqxybweyowj.supabase.co/functions/v1/vyrdict-bundle-fast?v=16' || true)
            if echo "$NAV" | grep -q '__vyrdictNavigationGuardV8' && echo "$BUNDLE" | grep -q 'cleanRoutePart' && ! echo "$BUNDLE" | grep -Fq 'match(/^/product/'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Browser audit
        shell: bash
        run: |
          mkdir -p qa
          cat > qa/audit.js <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');const base='https://vyrdict.com';const report={ok:false,checks:[]};const save=()=>fs.writeFileSync('qa/report.json',JSON.stringify(report,null,2));const pass=(n,d={})=>{report.checks.push({name:n,ok:true,...d});save()};const assert=(x,m)=>{if(!x)throw Error(m)};const sleep=m=>new Promise(r=>setTimeout(r,m));const fatal=s=>/SyntaxError|ReferenceError|TypeError|Invalid regular expression/i.test(String(s||''));
          async function clear(page,n){await page.waitForFunction(()=>['vyrdict-route-cover','startup-loader','vyrdict-product-transition'].every(id=>{const e=document.getElementById(id);if(!e)return true;const c=getComputedStyle(e);return c.display==='none'||c.visibility==='hidden'||+c.opacity===0}),null,{timeout:8000});pass(n+' loader')}
          async function product(page,n){await page.locator('.productHero').first().waitFor({state:'visible',timeout:30000});await page.waitForFunction(()=>{const a=[...document.querySelectorAll('.productHero .ring b')].slice(0,2).map(e=>(e.textContent||'').trim());return a.length===2&&a.every(x=>/^\d{1,3}$/.test(x))},null,{timeout:15000});await clear(page,n)}
          async function viewport(browser,name,w,h,mobile){const c=await browser.newContext({viewport:{width:w,height:h},isMobile:mobile,hasTouch:mobile}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e.stack||e.message||e)));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});let r=await p.goto(base+'/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});assert(r&&r.status()<400,name+' home HTTP');await p.locator('.hero').waitFor({state:'visible',timeout:30000});await clear(p,name+' home');let text=await p.locator('body').innerText();assert(/BROWSE\s+250\+\s+VERIFIED PRODUCTS/i.test(text),name+' 250+ missing');assert(!/BROWSE\s+267\+/i.test(text),name+' stale 267+');const d=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth}));assert(d.sw<=d.iw+4,name+' horizontal overflow');pass(name+' home');const det=p.locator('#categories details.v-home-category-details').first();await det.waitFor({state:'visible',timeout:15000});await det.locator(':scope > summary').click();const order=await p.evaluate(()=>{const d=document.querySelector('#categories details.v-home-category-details'),s=d.querySelector(':scope > summary'),a=[...d.querySelectorAll('.v-home-category-extra [data-category]')].filter(x=>x.offsetParent!==null),last=a[a.length-1];return{label:s.textContent.trim(),top:s.getBoundingClientRect().top,last:last?.getBoundingClientRect().bottom||0,count:a.length}});assert(order.count>0&&/Show fewer categories/i.test(order.label)&&order.top>=order.last-2,name+' category order');pass(name+' categories',order);await p.goto(base+'/category/kitchen/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});const card=p.locator('.grid .card').first();await card.waitFor({state:'visible',timeout:30000});await clear(p,name+' kitchen');const g=await card.evaluate(c=>{const pic=c.querySelector('.pic'),t=c.querySelector('.body h2'),i=pic?.querySelector('img'),pr=pic?.getBoundingClientRect(),tr=t?.getBoundingClientRect(),ir=i?.getBoundingClientRect();return{pic:pr?.height||0,img:ir?.height||0,picBottom:pr?.bottom||0,titleTop:tr?.top||0,titleHeight:tr?.height||0,title:(t?.textContent||'').trim()}});assert(g.titleTop>=g.picBottom-2,name+' kitchen title overlap');assert(g.titleHeight<100,name+' kitchen title too tall');if(mobile)assert(g.pic<=180&&g.img<=150,name+' mobile kitchen image too large');pass(name+' kitchen layout',g);await card.locator('.open').click();await p.waitForURL(/\/product\//,{timeout:20000});await product(p,name+' kitchen product');text=await p.locator('body').innerText();assert(/VIRAL SCORE/i.test(text)&&/WORTH SCORE/i.test(text)&&/WHERE TO BUY/i.test(text)&&await p.locator('.story').count(),name+' product incomplete');pass(name+' product open',{url:p.url()});await p.goBack({waitUntil:'domcontentloaded',timeout:30000});await p.locator('.grid .card').first().waitFor({state:'visible',timeout:30000});await clear(p,name+' back');assert(new URL(p.url()).pathname==='/category/kitchen/',name+' browser back wrong');pass(name+' browser back');assert(!errs.some(fatal),name+' fatal JS '+errs.filter(fatal).join(' | '));await p.screenshot({path:'qa/'+name+'.png',fullPage:true});await c.close()}
          async function products(browser){const c=await browser.newContext({viewport:{width:1280,height:900}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e.stack||e.message||e)));const cases=[['trtl-travel-pillow','98','88'],['lattafa-eclaire','99','86'],['ninja-slushi-professional-frozen-drink-maker'],['seeq-clear-protein'],['d-alba-white-truffle-first-spray-serum-100ml']];for(const [s,v,w] of cases){const r=await p.goto(`${base}/product/${s}/?qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});assert(r&&r.status()<400,s+' HTTP');await product(p,s);const a=await p.locator('.productHero .ring b').evaluateAll(x=>x.slice(0,2).map(y=>(y.textContent||'').trim()));assert(a.every(x=>/^\d{1,3}$/.test(x)),s+' missing score');if(v)assert(a[0]===v,s+' viral wrong '+a[0]);if(w)assert(a[1]===w,s+' worth wrong '+a[1]);assert(/WHERE TO BUY/i.test(await p.locator('body').innerText()),s+' where to buy missing');pass('product '+s,{scores:a})}await p.goto(base+'/product/trtl-travel-pillow/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await product(p,'Trtl markets');await p.locator('.geo-choice[data-geo="CA"]').waitFor({state:'visible',timeout:15000});for(const m of ['CA','US']){await p.locator(`.geo-choice[data-geo="${m}"]`).click();await sleep(500);const a=await p.locator('.productHero .ring b').evaluateAll(x=>x.slice(0,2).map(y=>(y.textContent||'').trim()));assert(a.every(x=>/^\d{1,3}$/.test(x)),'Trtl '+m+' score');const txt=await p.locator('#where-to-buy').innerText();assert(!/Worth Score pending|Market verification in progress/i.test(txt),'Trtl '+m+' pending');const links=p.locator('#where-to-buy a.retailer:visible');assert(await links.count()>0,'Trtl '+m+' retailer missing');const href=await links.first().getAttribute('href');assert(/^https?:\/\//.test(href||''),'Trtl '+m+' invalid link');pass('Trtl '+m,{scores:a,href})}assert(!errs.some(fatal),'direct product fatal '+errs.filter(fatal).join(' | '));await c.close()}
          async function routes(browser){const c=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e.stack||e.message||e)));let r=await p.goto(base+'/score-discovery?slug=seeq-clear-protein&market=US&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});assert(r&&r.status()<400,'score discovery HTTP');assert(/text\/html/i.test(r.headers()['content-type']||''),'score discovery MIME');await p.locator('#app').waitFor({state:'visible',timeout:30000});await p.waitForFunction(()=>/Score Discovery/i.test(document.body.innerText||''),null,{timeout:30000});assert(!/^<!?doctype|^<html/i.test((await p.locator('body').innerText()).trim()),'raw score HTML');pass('score discovery');r=await p.goto(base+'/search?q=Original%20Lip%20Kit&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});assert(r&&r.status()<400,'search HTTP');const lip=p.locator('[data-product="kylie-cosmetics-original-lip-kit"]').first();await lip.waitFor({state:'visible',timeout:30000});await lip.click();await p.waitForURL(u=>u.pathname==='/product/kylie-cosmetics-original-lip-kit/',{timeout:20000});await product(p,'search product');let h=(await p.locator('.productHero h1').textContent()||'').trim();assert(/Original Lip Kit/i.test(h)&&!/Eclaire/i.test(h),'search wrong product');pass('search routing',{heading:h});await p.goto(base+'/?clone='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await p.locator('[data-product]').first().waitFor({state:'visible',timeout:30000});await p.evaluate(()=>{const c=document.createElement('article');c.className='vyrdict-weekly-extra-v8';c.dataset.slug='kylie-cosmetics-original-lip-kit';c.style.cssText='position:fixed;top:100px;left:5px;z-index:9999;background:#fff;padding:20px';c.innerHTML='<button id="stale" data-product="lattafa-eclaire">SEE VYRDICT</button>';document.body.appendChild(c)});await p.locator('#stale').click();await p.waitForURL(u=>u.pathname==='/product/kylie-cosmetics-original-lip-kit/',{timeout:20000});await product(p,'weekly clone');h=(await p.locator('.productHero h1').textContent()||'').trim();assert(/Original Lip Kit/i.test(h)&&!/Eclaire/i.test(h),'weekly clone wrong');pass('weekly clone routing',{heading:h});for(const path of ['/collection/viral-right-now/','/category/beauty/','/search?q=ninja','/careers/']){const rr=await p.goto(base+path+(path.includes('?')?'&':'?')+'qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});assert(rr&&rr.status()<400,path+' HTTP '+rr?.status());const txt=await p.locator('body').innerText();assert(!/Could not load the site|Product temporarily unavailable/i.test(txt),path+' error page');pass('route '+path,{status:rr.status()})}assert(!errs.some(fatal),'route fatal '+errs.filter(fatal).join(' | '));await c.close()}
          (async()=>{let b;try{b=await chromium.launch({headless:true});await viewport(b,'mobile',390,844,true);await viewport(b,'desktop',1440,1000,false);await products(b);await routes(b);report.ok=true;save();console.log('VYRDICT_FINAL_PASS');console.log(JSON.stringify(report,null,2))}catch(e){report.error=String(e.stack||e);save();console.error(e);process.exitCode=1}finally{await b?.close()}})();
          NODE
          node qa/audit.js 2>&1 | tee qa/console.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyrdict-final-site-audit-v3
          path: qa/
          retention-days: 7
