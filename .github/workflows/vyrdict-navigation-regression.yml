name: VYRDICT Navigation Regression

on:
  push:
    paths:
      - '.github/workflows/vyrdict-navigation-regression.yml'
      - 'navigation-context.js'
      - 'navigation-guard.js'
      - 'index.html'
      - 'product-shell.js'
      - 'product-fast.js'
      - 'evidence.html'
      - 'api/product-seo.js'
      - 'api/category-seo.js'
  workflow_dispatch:

jobs:
  navigation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for production return-context navigation
        run: |
          for i in $(seq 1 40); do
            if curl -fsSL 'https://vyrdict.com/navigation-context.js?v=1' | grep -q 'function showCover'; then
              echo 'Return-context navigation is live'
              exit 0
            fi
            sleep 5
          done
          echo 'Return-context navigation did not reach production in time'
          exit 1
      - name: Test painted viewport and contextual back navigation
        run: |
          cat > nav-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const base='https://vyrdict.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          async function paintState(page,label){
            const s=await page.evaluate((label)=>{
              const cover=!!document.getElementById('vyrdict-route-cover');
              const bodyBg=getComputedStyle(document.body||document.documentElement).backgroundColor;
              const meaningfulTag=/^(A|BUTTON|IMG|H1|H2|H3|H4|P|SPAN|STRONG|B|SMALL|INPUT|ARTICLE|SECTION)$/;
              let hit=0,total=0;
              const xs=[.10,.30,.50,.70,.90].map(x=>Math.max(2,Math.min(innerWidth-2,Math.round(innerWidth*x))));
              const ys=[.14,.24,.34,.44,.54,.64,.74,.84,.94].map(y=>Math.max(2,Math.min(innerHeight-2,Math.round(innerHeight*y))));
              for(const x of xs)for(const y of ys){
                total++;
                const els=document.elementsFromPoint(x,y);
                const painted=els.some(el=>{
                  if(el===document.documentElement||el===document.body)return false;
                  const cs=getComputedStyle(el);
                  if(cs.display==='none'||cs.visibility==='hidden'||Number(cs.opacity)===0)return false;
                  if(el.id==='vyrdict-route-cover')return true;
                  if(meaningfulTag.test(el.tagName))return true;
                  const bg=cs.backgroundColor;
                  return bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'&&bg!==bodyBg;
                });
                if(painted)hit++;
              }
              const ratio=total?hit/total:0;
              return {label,path:location.pathname+location.search,scrollY,cover,ratio,bodyText:(document.body?.innerText||'').slice(0,220)};
            },label);
            console.log('PAINT '+JSON.stringify(s));
            return s;
          }

          async function assertPainted(page,label){
            const s=await paintState(page,label);
            assert(s.cover||s.ratio>=0.08,`${label}: blank viewport: ${JSON.stringify(s)}`);
            return s;
          }

          async function watchPaint(page,label,ms=2600){
            const started=Date.now();
            let consecutiveBlank=0,maxBlank=0,samples=0;
            while(Date.now()-started<ms){
              try{
                const s=await paintState(page,label+'@'+(Date.now()-started));
                samples++;
                if(!s.cover&&s.ratio<0.08)consecutiveBlank+=100;else consecutiveBlank=0;
                maxBlank=Math.max(maxBlank,consecutiveBlank);
              }catch(e){}
              await sleep(100);
            }
            assert(samples>2,`${label}: insufficient viewport samples`);
            assert(maxBlank<500,`${label}: blank viewport persisted ${maxBlank}ms`);
          }

          async function waitProduct(page){
            await page.locator('.productHero').first().waitFor({state:'visible',timeout:25000});
            await sleep(120);
            const s=await assertPainted(page,'product ready');
            assert(s.scrollY<80,`product restored at wrong scroll position: ${JSON.stringify(s)}`);
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const fatal=[];
            page.on('pageerror',e=>{
              const m=String(e?.stack||e?.message||e);
              console.error('PAGEERROR',m);
              if(/Invalid regular expression|SyntaxError/i.test(m))fatal.push(m);
            });

            await page.goto(base+'/?navqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('[data-product]').first().waitFor({state:'visible',timeout:25000});
            await assertPainted(page,'home ready');
            let watch=watchPaint(page,'home to product');
            await page.locator('[data-product]').first().click();
            await page.waitForURL(/\/product\//,{timeout:15000});
            await waitProduct(page);
            await watch;

            const productUrl=page.url();
            const evidence=page.locator('a[href*="/evidence.html?slug="]').first();
            await evidence.waitFor({state:'visible',timeout:15000});
            await evidence.scrollIntoViewIfNeeded();
            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            watch=watchPaint(page,'product to evidence');
            await evidence.click();
            await page.waitForURL(/\/evidence\.html\?slug=/,{timeout:15000});
            await page.locator('#productBack').waitFor({state:'visible',timeout:15000});
            await assertPainted(page,'evidence loading');
            await page.waitForFunction(()=>!/Loading the evidence/i.test(document.body?.innerText||''),null,{timeout:20000});
            await assertPainted(page,'evidence ready');
            await watch;

            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            watch=watchPaint(page,'evidence back to product',3200);
            await page.locator('#productBack').click();
            await page.waitForURL(/\/product\//,{timeout:15000});
            await waitProduct(page);
            await watch;
            assert(new URL(page.url()).pathname===new URL(productUrl).pathname,'Evidence Back returned to wrong product');

            await page.goto(base+'/category/beauty/?navqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.grid .card').first().waitFor({state:'visible',timeout:20000});
            await assertPainted(page,'category ready');
            const count=await page.locator('.grid .card').count();
            const card=page.locator('.grid .card').nth(Math.min(Math.max(0,count-1),4));
            await card.scrollIntoViewIfNeeded();
            await sleep(100);
            const categorySourceY=await page.evaluate(()=>scrollY);
            assert(categorySourceY>80,`Category test did not reach a meaningful scroll position: ${categorySourceY}`);
            await card.click();
            await page.waitForURL(/\/product\//,{timeout:15000});
            await waitProduct(page);

            await page.locator('[data-back]').first().click();
            await page.waitForURL(/\/category\/beauty\//,{timeout:15000});
            await page.locator('.grid .card').first().waitFor({state:'visible',timeout:20000});
            await sleep(1100);
            const categoryState=await assertPainted(page,'category after contextual back');
            assert(Math.abs(categoryState.scrollY-categorySourceY)<260,`Category Back lost its prior position: before=${categorySourceY}, after=${categoryState.scrollY}`);

            for(const u of ['/collection/viral-right-now/','/search?q=ninja']){
              const r=await page.goto(base+u,{waitUntil:'domcontentloaded',timeout:60000});
              assert(r&&r.status()<400,`${u}: HTTP ${r?.status()}`);
              await page.locator('#app,.grid,.hero').first().waitFor({state:'visible',timeout:25000});
              await sleep(150);
              await assertPainted(page,u);
            }

            assert(fatal.length===0,'JavaScript syntax errors detected: '+fatal.join(' | '));
            console.log('NAVIGATION_REGRESSION_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node nav-qa.js
