name: VYRDICT Navigation Regression

on:
  push:
    paths:
      - '.github/workflows/vyrdict-navigation-regression.yml'
      - 'navigation-guard.js'
      - 'index.html'
      - 'product-shell.js'
      - 'product-fast.js'
      - 'evidence.html'
      - 'api/product-seo.js'
      - 'api/category-seo.js'
  workflow_dispatch:

jobs:
  navigation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for V2 production guard
        run: |
          for i in $(seq 1 40); do
            if curl -fsSL 'https://vyrdict.com/navigation-guard.js?v=1' | grep -q '__vyrdictNavigationGuardV2'; then
              echo 'V2 guard is live'
              exit 0
            fi
            sleep 5
          done
          echo 'V2 guard did not reach production in time'
          exit 1
      - name: Test blank-screen regressions
        run: |
          cat > nav-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const base='https://vyrdict.com';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          async function syntaxScan(page,label){
            const bad=await page.evaluate(()=>[...document.scripts].map((s,i)=>{
              if(s.src)return null;
              const type=(s.getAttribute('type')||'').toLowerCase();
              if(type&&!['text/javascript','application/javascript','module'].includes(type))return null;
              const text=s.textContent||'';
              if(!text.trim())return null;
              try{new Function(text);return null}catch(e){return {i,message:String(e.message||e),start:text.slice(0,650),end:text.slice(-650)}}
            }).filter(Boolean));
            console.log('SYNTAX_SCAN '+label+' '+JSON.stringify(bad));
            return bad;
          }
          async function visibleState(page,label){
            const s=await page.evaluate(()=>{
              const cover=document.getElementById('vyrdict-route-cover');
              const els=[...document.elementsFromPoint(innerWidth/2,Math.min(innerHeight/2,500))];
              const meaningful=els.some(el=>{
                if(el===document.documentElement||el===document.body)return false;
                const cs=getComputedStyle(el);
                if(cs.visibility==='hidden'||cs.display==='none'||Number(cs.opacity)===0)return false;
                const r=el.getBoundingClientRect();
                return r.width>20&&r.height>20&&((el.textContent||'').trim().length>0||el.querySelector?.('img,button,a'));
              });
              return {scrollY,cover:!!cover,meaningful,path:location.pathname+location.search,bodyText:(document.body?.innerText||'').slice(0,180)};
            });
            assert(s.cover||s.meaningful,`${label}: viewport is blank: ${JSON.stringify(s)}`);
            return s;
          }
          async function waitProduct(page){
            await page.locator('.productHero').first().waitFor({state:'visible',timeout:25000});
            await page.waitForTimeout(150);
            const s=await visibleState(page,'product ready');
            assert(s.scrollY<80,`product did not return to top: ${JSON.stringify(s)}`);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            page.on('pageerror',e=>console.error('PAGEERROR',e.stack||e.message));

            await page.goto(base+'/?navqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('[data-product]').first().waitFor({state:'visible',timeout:25000});
            await syntaxScan(page,'HOME');
            await page.locator('[data-product]').first().click();
            await page.waitForURL(/\/product\//,{timeout:15000});
            await page.waitForTimeout(1800);
            await syntaxScan(page,'PRODUCT_AFTER_SWAP');
            console.log('PRODUCT_STATE '+JSON.stringify(await page.evaluate(()=>({url:location.href,text:(document.body?.innerText||'').slice(0,500),scripts:document.scripts.length,html:(document.documentElement?.outerHTML||'').slice(0,800)}))));
            await waitProduct(page);

            const productUrl=page.url();
            const evidence=page.locator('a[href*="/evidence.html?slug="]').first();
            await evidence.waitFor({state:'visible',timeout:15000});
            await evidence.scrollIntoViewIfNeeded();
            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await visibleState(page,'product before evidence');
            await evidence.click();
            await page.waitForURL(/\/evidence\.html\?slug=/,{timeout:15000});
            await page.locator('#productBack').waitFor({state:'visible',timeout:15000});
            await visibleState(page,'evidence ready');
            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await page.locator('#productBack').click();
            await page.waitForURL(/\/product\//,{timeout:15000});
            await waitProduct(page);
            assert(new URL(page.url()).pathname===new URL(productUrl).pathname,'evidence back returned to wrong product');

            await page.goto(base+'/category/beauty/?navqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.grid .card').first().waitFor({state:'visible',timeout:20000});
            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await page.locator('.grid .card').first().click();
            await page.waitForURL(/\/product\//,{timeout:15000});
            await waitProduct(page);
            await page.goBack({waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('.grid .card').first().waitFor({state:'visible',timeout:20000});
            await page.waitForTimeout(150);
            const categoryState=await visibleState(page,'category after browser back');
            assert(categoryState.scrollY<80,`category browser back restored deep/blank scroll: ${JSON.stringify(categoryState)}`);

            for(const u of ['/collection/viral-right-now/','/search?q=ninja']){
              const r=await page.goto(base+u,{waitUntil:'domcontentloaded',timeout:60000});
              assert(r&&r.status()<400,`${u}: HTTP ${r?.status()}`);
              await page.locator('#app,.grid,.hero').first().waitFor({state:'visible',timeout:25000});
              await visibleState(page,u);
            }

            console.log('NAVIGATION_REGRESSION_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node nav-qa.js
