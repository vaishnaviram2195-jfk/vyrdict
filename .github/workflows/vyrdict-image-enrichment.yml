name: VYRDICT Image Enrichment

# Catalog cleanup trigger: 2026-08-18 pass 4
on:
  push:
    paths:
      - '.github/workflows/vyrdict-image-enrichment.yml'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger verified image enrichment batches
        run: |
          for i in $(seq 1 18); do
            curl --fail --silent --show-error --output /dev/null \
              "https://shmbvkjzeqqxybweyowj.supabase.co/functions/v1/vyrdict-bundle?enrich=$i"
            sleep 2
          done
