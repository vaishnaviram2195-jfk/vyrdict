<style>
:root{--ink:#252b24;--line:#444f3740;--button:#e1edc8;--button-hover:#d4e5b7;--pink:#f7a2b8;--dark:#252c25;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}body{margin:0;min-height:100%;background:#d9e6e7;font-family:var(--sans);color:var(--ink);isolation:isolate}
body:before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background-image:linear-gradient(100deg,rgba(255,255,247,.08),rgba(250,255,248,.02) 36%,rgba(255,245,236,.09) 78%),url("https://images.pexels.com/photos/11738912/pexels-photo-11738912.jpeg?auto=compress&cs=tinysrgb&w=1800");background-position:50% center;background-size:cover;background-repeat:no-repeat;filter:saturate(1.1)}
body:after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(255,252,242,.40),rgba(255,251,246,.18) 33%,rgba(255,255,255,.05) 75%),linear-gradient(125deg,transparent 38%,rgba(255,255,255,.15) 48%,transparent 59%);background-size:100% 100%,250% 100%;animation:glimmer 17s ease-in-out infinite alternate}
@keyframes glimmer{from{background-position:center,0% center}to{background-position:center,100% center}}
a,button{outline-offset:4px}a:focus-visible,button:focus-visible{outline:3px solid #586e35}
.shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:45px 18px 28px}
.page{width:min(585px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.logo{width:77px;height:77px;border-radius:50%;background:#c1dbe8;display:flex;justify-content:center;align-items:center;box-shadow:0 8px 23px rgba(112,0,14,.12);margin-bottom:13px}
.vmark{color:#70000e;font:italic 400 52px/1 var(--serif);-webkit-text-stroke:.65px currentColor;paint-order:stroke fill;position:relative;display:inline-block;letter-spacing:-.08em;padding-right:13px;padding-top:3px}
.vmark:after{content:"";height:7px;width:7px;background:#d66c8b;position:absolute;right:1px;bottom:12px;transform:rotate(0deg)}
h1{font:400 clamp(42px,7vw,51px)/.99 var(--serif);letter-spacing:-.03em;margin:0;color:#293229;text-shadow:0 1px 1px rgba(255,255,255,.42)}
.intro{max-width:408px;margin:13px auto 17px;font-size:14.1px;line-height:1.56;letter-spacing:.005em;font-weight:600;color:#333d32;text-shadow:0 1px 2px #fff9}
.intro b{font-weight:800}
.socials{display:flex;gap:19px;align-items:center;justify-content:center;margin:0 0 24px}
.socials a{color:#28342c;width:29px;height:29px;display:grid;place-items:center;transition:transform .2s,background .2s;border-radius:50%;background:rgba(255,255,255,.16)}
.socials a:hover{transform:translateY(-3px);background:#ffffffa6}
.socials svg{width:18px;height:18px;stroke-width:1.9}
.links{display:flex;flex-direction:column;width:100%;gap:11px}
.link{border-radius:22px;min-height:80px;width:100%;padding:12px 17px 12px 14px;display:grid;grid-template-columns:44px 1fr 25px;gap:14px;text-align:left;align-items:center;color:var(--ink);text-decoration:none;background:var(--button);border:1px solid rgba(255,255,255,.75);box-shadow:0 7px 20px #3e4c3a1b,0 1px 3px #29352916;transition:background .25s,transform .25s,box-shadow .25s;cursor:pointer}
.link:hover{background:var(--button-hover);transform:translateY(-3px);box-shadow:0 11px 30px #27392329}
.link:active{transform:translateY(0)}
.icon-circle{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#fffefa9e;border:1px solid rgba(61,76,51,.11)}
.icon-circle svg{width:23px;height:23px;stroke:#37482f;stroke-width:1.6}
.link-copy{min-width:0}.link-title{display:block;font:400 clamp(22px,3vw,24px)/1.06 var(--serif);letter-spacing:-.03em;color:#293229}
.link-sub{display:block;font-size:10.4px;line-height:1.45;margin-top:5px;color:#4a5647;font-weight:600;letter-spacing:.003em}
.arr{background:#2d382c;color:white;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;font-size:16px;line-height:1;box-shadow:0 2px 6px #2234221b}
.tagline{margin-top:25px;color:#343e36;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;text-shadow:0 1px 2px #fff}




.shades button[aria-pressed="true"]{background:#2c382d;color:white;border-color:#2c382d}
.preview-flag{position:fixed;top:12px;right:14px;font-size:9px;letter-spacing:.08em;font-weight:800;z-index:3;color:#56615a;background:rgba(255,255,255,.76);padding:7px 11px;border-radius:20px;border:1px solid #fffb;pointer-events:none}


body[data-shade="olive"]{--button:#cbd8ab;--button-hover:#b9cb8f}
body:has(dialog[open]){overflow:hidden}
dialog{width:min(520px,calc(100vw - 30px));max-height:82dvh;overflow:auto;border:1px solid #c3c8b8;border-radius:15px;padding:25px 24px;background:#f9faf3;box-shadow:0 20px 75px #1c2b2340;color:#2b342b}
dialog::backdrop{background:#23312970;backdrop-filter:blur(4px)}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.modal-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}
.close-modal{width:35px;height:35px;border:1px solid #86917e;border-radius:50%;font-size:19px;display:grid;place-items:center;background:transparent;color:var(--ink);cursor:pointer}
dialog h2{font:400 43px/1 var(--serif);margin:19px 0 10px}
dialog p{font-size:13px;line-height:1.6;color:#566151;margin:0 0 14px}
.study{display:flex;justify-content:space-between;align-items:center;padding:13px 0;text-decoration:none;border-top:1px solid #b9c2ae;font:400 23px var(--serif)}
.study span{font:700 11px var(--sans);letter-spacing:.01em}.study:hover{color:#567142}
.note{border-top:1px solid #b9c2ae;padding-top:12px;font-size:11px;line-height:1.5;color:#656e61}
@media (max-width:540px){.shell{align-items:flex-start;padding:58px 13px 38px}.logo{width:68px;height:68px;margin-bottom:13px}.vmark{font-size:45px;-webkit-text-stroke:.55px currentColor}.vmark:after{width:6px;height:6px;bottom:10px}h1{font-size:43px}.intro{font-size:13.6px;max-width:390px;margin:11px auto 15px}.socials{margin-bottom:21px}.links{gap:10px}.link{min-height:76px;padding:11px 13px;grid-template-columns:40px 1fr 23px;gap:12px;border-radius:20px}.icon-circle{width:40px;height:40px}.icon-circle svg{height:22px;width:22px}.link-title{font-size:22px}.link-sub{font-size:10px}.arr{width:23px;height:23px}.tagline{margin-top:23px}.preview-panel{margin-top:16px}.preview-flag{top:10px;right:10px;font-size:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}body:after{animation:none}*,*:before,*:after{transition:none!important}}

/* Contrast study: cherry-cola links on the approved icy, iridescent glass background. */
body[data-shade="cola"]{--button:#633849;--button-hover:#77485a}
body[data-shade="cola"] .link{
  border-color:rgba(255,248,241,.72);
  box-shadow:0 9px 22px rgba(53,29,46,.24),0 2px 5px rgba(53,29,46,.11);
}
body[data-shade="cola"] .link-title{color:#fffaf4}
body[data-shade="cola"] .link-sub{color:#f4e6e8}
body[data-shade="cola"] .icon-circle{
  background:#f9f1ec;
  border-color:rgba(255,255,255,.7);
}
body[data-shade="cola"] .icon-circle svg{stroke:#643849}
body[data-shade="cola"] .arr{
  background:#f8f0eb;
  color:#623747;
  box-shadow:0 2px 6px rgba(40,23,36,.13);
}
body[data-shade="cola"] .link:hover{
  background:#77485a;
  box-shadow:0 12px 30px rgba(53,29,46,.27);
}

/* Visible pastel glass: clear texture and reflections with localized copy protection. */
body{background:#e2edf7}
body:before{
 inset:-3px;
 opacity:.72;
 filter:blur(.6px) saturate(.45) brightness(1.35) contrast(.84)!important;
 background-position:center center!important;
}
body:after{
 background:
  radial-gradient(ellipse at 12% 20%,rgba(243,195,214,.56),rgba(243,195,214,0) 45%),
  radial-gradient(ellipse at 86% 15%,rgba(250,239,184,.50),rgba(250,239,184,0) 39%),
  radial-gradient(ellipse at 78% 82%,rgba(204,224,204,.45),rgba(204,224,204,0) 42%),
  radial-gradient(ellipse at 22% 84%,rgba(195,216,245,.46),rgba(195,216,245,0) 50%),
  linear-gradient(115deg,rgba(224,237,249,.36),rgba(224,237,249,.16) 60%,rgba(233,242,249,.22)),
  linear-gradient(125deg,transparent 38%,rgba(255,255,255,.18) 48%,transparent 59%)!important;
 background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,250% 100%!important;
}
.page{isolation:isolate}
.page:before{
 content:"";position:absolute;left:0;right:0;top:55px;height:225px;
 z-index:-1;pointer-events:none;
 background:radial-gradient(ellipse at 50% 48%,rgba(255,254,251,.92),rgba(255,254,251,.64) 38%,rgba(255,254,251,0) 72%);
 filter:blur(14px);
}
.intro{
 position:relative;color:#3b2e41;
 font-size:14.5px;line-height:1.65;font-weight:600;
 text-shadow:0 1px 1px rgba(255,255,255,.7);
}
.intro b{color:#342638;font-weight:700}
@media(max-width:540px){
 .intro{font-size:13.8px}
 .page:before{top:48px;height:225px}
}
/* Real circular image thumbnails for the three hub destinations. */
.icon-circle{overflow:hidden}
.icon-circle>img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:inherit}

.intro a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Comfortable tap targets and readable descriptions on phones. */
@media(max-width:540px){
 .socials{gap:12px}
 .socials a{width:44px;height:44px}
 .link-sub{font-size:12px;line-height:1.5}
}
